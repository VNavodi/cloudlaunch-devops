name: Publish CloudLaunch to ECR

on:
  workflow_run:
    workflows: ["CloudLaunch CI Pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish immutable image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
        run: |
          docker build -t "$REGISTRY/cloudlaunch:$IMAGE_TAG" ./app
          docker push "$REGISTRY/cloudlaunch:$IMAGE_TAG"
          echo "Published $REGISTRY/cloudlaunch:$IMAGE_TAG"
