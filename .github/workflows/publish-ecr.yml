name: Publish CloudLaunch to ECR

on:
  workflow_run:
    workflows: ["CloudLaunch CI Pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ecr-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      vars.ECR_PUBLISH_ENABLED == 'true' &&
      vars.AWS_ECR_PUBLISH_ROLE_ARN != '' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ecr-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # Never checkout or execute code from a triggering artifact.
      - name: Download image from the exact successful CI run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: scanned-image-${{ github.event.workflow_run.head_sha }}
          path: image-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Verify and load scanned image without running it
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$(cat image-artifact/commit.txt)" == "$EXPECTED_SHA" ]]
          EXPECTED_ID=$(cat image-artifact/image-id.txt)
          [[ "$EXPECTED_ID" =~ ^sha256:[a-f0-9]{64}$ ]]
          EXPECTED_HASH=$(cut -d ' ' -f1 image-artifact/image.tar.sha256)
          [[ "$EXPECTED_HASH" =~ ^[a-f0-9]{64}$ ]]
          [[ "$(sha256sum image-artifact/image.tar | cut -d ' ' -f1)" == "$EXPECTED_HASH" ]]
          docker load -i image-artifact/image.tar
          [[ "$(docker image inspect cloudlaunch:ci --format '{{.Id}}')" == "$EXPECTED_ID" ]]
          [[ "$(docker image inspect cloudlaunch:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" == "$EXPECTED_SHA" ]]

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ap-southeast-2
          allowed-account-ids: '636621822646'
          role-session-name: cloudlaunch-publish-${{ github.run_id }}

      - name: Verify account before ECR access
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = 636621822646
          test "$(aws ecr describe-repositories --repository-names cloudlaunch --query 'repositories[0].imageTagMutability' --output text)" = IMMUTABLE

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2

      - name: Publish or verify existing immutable tag
        env:
          IMAGE_TAG: sha-${{ github.event.workflow_run.head_sha }}
          REGISTRY: 636621822646.dkr.ecr.ap-southeast-2.amazonaws.com
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/cloudlaunch:$IMAGE_TAG"
          EXPECTED_ID=$(cat image-artifact/image-id.txt)
          # Do not interpret access/network failures as a missing tag.
          if aws ecr describe-images --repository-name cloudlaunch --image-ids "imageTag=$IMAGE_TAG" > existing.json 2> ecr-error.txt; then
            docker pull "$IMAGE"
            [[ "$(docker image inspect "$IMAGE" --format '{{.Id}}')" == "$EXPECTED_ID" ]]
            echo 'Existing immutable tag matches tested image.'
          elif grep -q 'ImageNotFoundException' ecr-error.txt; then
            docker tag cloudlaunch:ci "$IMAGE"
            docker push "$IMAGE"
            docker pull "$IMAGE"
            [[ "$(docker image inspect "$IMAGE" --format '{{.Id}}')" == "$EXPECTED_ID" ]]
          else
            cat ecr-error.txt >&2
            exit 1
          fi
          DIGEST=$(aws ecr describe-images --repository-name cloudlaunch --image-ids "imageTag=$IMAGE_TAG" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf 'Published/verified %s/cloudlaunch@%s from CI run %s, image ID %s.\n' "$REGISTRY" "$DIGEST" "$CI_RUN_ID" "$EXPECTED_ID" >> "$GITHUB_STEP_SUMMARY"
