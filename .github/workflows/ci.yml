
name: CloudLaunch CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and Build Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      - name: Run automated tests
        working-directory: ./app
        run: npm test

      - name: Build Docker image
        run: docker build -t cloudlaunch:ci ./app

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: 'cloudlaunch:ci'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          vuln-type: 'os,library'
          exit-code: '0'

  terraform-validate:
    name: Validate Terraform Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./terraform

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.5'

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

  deployment-safety-tests:
    name: Deployment Safety and Recovery Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate Bash script syntax
        run: |
          bash -n scripts/promote-container.sh
          bash -n scripts/rollback-container.sh
          bash -n scripts/deploy.sh
          bash -n tests/*.sh

      - name: Run deployment safety tests
        run: |
          env -u PROMOTION_ENABLED -u ROLLBACK_ENABLED \
            bash tests/test-promotion.sh

      - name: Run successful promotion mock test
        run: |
          env -u PROMOTION_ENABLED -u ROLLBACK_ENABLED \
            bash tests/test-promotion-mock.sh

      - name: Run failed promotion recovery mock test
        run: |
          env -u PROMOTION_ENABLED -u ROLLBACK_ENABLED \
            bash tests/test-promotion-failure.sh
